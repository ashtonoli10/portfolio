<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashton Oliphant | My Garage</title>
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Same nav on every page -->
  <nav class="site-nav">
    <div class="container d-flex flex-wrap align-items-center gap-3 py-2">
      <a class="nav-name" href="index.html">Ashton Oliphant</a>
      <a href="index.html#projects">Projects</a>
      <a href="about-me.html">About Me</a>
      <a href="index.html#contact">Contact</a>
      <button id="theme-btn" class="btn btn-sm btn-outline-light ms-auto" type="button">Dark mode</button>
    </div>
  </nav>

  <main class="container py-4">
    <h1>My Garage</h1>
    <p class="lead">My Assignment 6 feature: visitors share the car they are working on.</p>

    <section class="card card-body mb-3">
      <h2>What car are you working on right now?</h2>
      <img src="cars.png" alt="Three cars lined up at a gas station at night" class="img-fluid rounded mb-3">
      <label for="car-input" class="form-label">Your car (year, make, and model)</label>
      <div class="d-flex flex-wrap gap-2">
        <input type="text" id="car-input" class="form-control garage-input" placeholder="Year, make, and model">
        <button type="button" id="add-car" class="btn btn-brand">Add my car</button>
      </div>
      <ul id="car-list" class="mt-3"></ul>
      <p id="car-count"></p>
    </section>

    <footer><p>&copy; 2026 Ashton Oliphant</p></footer>
  </main>

  <script src="script.js"></script>
</body>
